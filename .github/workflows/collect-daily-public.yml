name: Daily public social snapshot

on:
  schedule:
    # GitHub scheduled workflows are best-effort and may be delayed.
    # Five-minute runs are cheap gates. Imputed rows only become real retry
    # targets after their platform-specific backoff expires.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-daily-public.yml"
      - "scripts/collect-or-retry-daily.mjs"
      - "scripts/retry-platform-fallbacks.mjs"
      - "scripts/prepare-imputed-retry.mjs"
      - "scripts/impute-missing-daily.mjs"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-public-social-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional official fallbacks. The workflow remains functional when
      # these secrets are unset; public/no-auth routes are tried instead.
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    outputs:
      snapshot_changed: ${{ steps.changes.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical official-account directory
        run: node scripts/validate-directory.mjs

      - name: Check collector syntax
        run: |
          node --check scripts/collect-daily-public.mjs
          node --check scripts/collect-or-retry-daily.mjs
          node --check scripts/retry-platform-fallbacks.mjs
          node --check scripts/prepare-imputed-retry.mjs
          node --check scripts/impute-missing-daily.mjs

      - name: Collect through independent routes, then fill unresolved gaps
        shell: bash
        run: |
          has_failed_rows() {
            node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync("data/live/latest.json","utf8")); process.exit(s.accounts.some(r=>r.error) ? 0 : 1)'
          }

          # Only imputed rows whose retry window has expired are reopened.
          # This prevents a five-minute cron from hammering a rate-limited API.
          node scripts/prepare-imputed-retry.mjs

          # Primary route: Pulse for X/Instagram/TikTok and direct YouTube About.
          node scripts/collect-or-retry-daily.mjs

          # Independent fallbacks, not another request through the same provider:
          # Instagram: optional Meta Business Discovery -> i.instagram.com -> www/feed
          # TikTok: public profile hydration JSON (statsV2 when available)
          # X: optional API v2 -> public syndication endpoint
          if has_failed_rows; then
            echo "Primary route left gaps; trying independent platform fallbacks."
            node scripts/retry-platform-fallbacks.mjs || true
          fi

          # One delayed primary retry handles transient provider/network faults.
          # Persistent blocks are not hammered repeatedly in the same Action.
          if has_failed_rows; then
            echo "Some rows remain unavailable; one transient retry in 45 seconds."
            sleep 45
            node scripts/collect-or-retry-daily.mjs
          fi

          # Keep the daily table usable without pretending stale values are real.
          # Imputed rows are tagged and excluded from growth/rate calculations.
          node scripts/impute-missing-daily.mjs

      - name: Detect whether snapshot data changed
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/live public/data && [ -z "$(git status --porcelain -- data/live public/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot data changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot files changed."
          fi

      - name: Validate snapshot integrity before commit
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/validate-snapshots.mjs

      - name: Commit snapshot progress
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live public/data
          git commit -m "data: daily social snapshot $(TZ=Asia/Tokyo date +%F)"
          git push

      - name: Summary
        if: always()
        run: |
          echo "Actual start: $(TZ=Asia/Tokyo date '+%F %H:%M:%S %Z')"
          echo "Snapshot changed: ${{ steps.changes.outputs.changed || 'false' }}"
          echo "Schedule cadence: every 5 minutes; per-row acquisition retries are backoff-controlled."
          echo "Routes: primary provider/direct YouTube -> independent platform fallbacks -> one transient retry -> tagged imputation."
          echo "Instagram backoff starts at 6h; X/TikTok at 1h; YouTube at 30m and increases after repeated failures."
          echo "Imputed rows remain excluded from growth and rate calculations."

  deploy:
    name: Build and deploy latest snapshot
    needs: collect
    if: needs.collect.outputs.snapshot_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main after snapshot commit
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical directory
        run: npm run directory:validate

      - name: Validate snapshot integrity
        run: npm run data:validate

      - name: Check collector syntax
        run: |
          node --check scripts/collect-daily-public.mjs
          node --check scripts/collect-or-retry-daily.mjs
          node --check scripts/retry-platform-fallbacks.mjs
          node --check scripts/prepare-imputed-retry.mjs
          node --check scripts/impute-missing-daily.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site with latest snapshot
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
