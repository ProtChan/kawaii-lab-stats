name: Daily public social snapshot

on:
  schedule:
    # GitHub scheduled workflows are best-effort and may be delayed.
    # Run every five minutes. Every later run retries rows that are still
    # missing or currently filled from an imputed fallback.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-daily-public.yml"
      - "scripts/collect-or-retry-daily.mjs"
      - "scripts/retry-instagram-web.mjs"
      - "scripts/prepare-imputed-retry.mjs"
      - "scripts/impute-missing-daily.mjs"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-public-social-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      snapshot_changed: ${{ steps.changes.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical official-account directory
        run: node scripts/validate-directory.mjs

      - name: Check collector syntax
        run: |
          node --check scripts/collect-daily-public.mjs
          node --check scripts/collect-or-retry-daily.mjs
          node --check scripts/retry-instagram-web.mjs
          node --check scripts/prepare-imputed-retry.mjs
          node --check scripts/impute-missing-daily.mjs

      - name: Collect, retry, then fill unresolved gaps
        shell: bash
        run: |
          observed_complete() {
            node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync("data/live/latest.json","utf8")); const imputed=Number(s.imputed)||s.accounts.filter(r=>r.imputed&&!r.error).length; const failed=Number(s.failed)||s.accounts.filter(r=>r.error).length; process.exit((s.observedComplete === true || (s.observedComplete == null && failed===0 && imputed===0)) ? 0 : 1)'
          }

          # Values imputed by an earlier run are never treated as final.
          # Turn them back into retry targets before attempting collection.
          node scripts/prepare-imputed-retry.mjs
          node scripts/collect-or-retry-daily.mjs

          if ! observed_complete; then
            echo "Snapshot not fully observed; trying Instagram public web fallback."
            node scripts/retry-instagram-web.mjs || true
            node scripts/collect-or-retry-daily.mjs
          fi

          for attempt in 1 2; do
            if observed_complete; then
              echo "Snapshot is fully observed."
              break
            fi
            echo "Still not fully observed; retrying failed rows in 30 seconds (${attempt}/2)."
            sleep 30
            node scripts/collect-or-retry-daily.mjs
          done

          # Do not leave holes in the usable daily dataset. Any row that is
          # still unavailable is filled from its most recent real observation.
          # imputed=true keeps it out of growth/rate calculations, and the next
          # Action will retry it as a real observation again.
          node scripts/impute-missing-daily.mjs

      - name: Detect whether snapshot data changed
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/live public/data && [ -z "$(git status --porcelain -- data/live public/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot data changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot files changed."
          fi

      - name: Validate snapshot integrity before commit
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/validate-snapshots.mjs

      - name: Commit snapshot progress
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live public/data
          git commit -m "data: daily social snapshot $(TZ=Asia/Tokyo date +%F)"
          git push

      - name: Summary
        if: always()
        run: |
          echo "Actual start: $(TZ=Asia/Tokyo date '+%F %H:%M:%S %Z')"
          echo "Snapshot changed: ${{ steps.changes.outputs.changed || 'false' }}"
          echo "Schedule cadence: every 5 minutes."
          echo "Order: real capture -> Instagram fallback -> retry -> last-observed imputation."
          echo "Imputed rows are retried as real observations by later Actions."
          echo "Imputed rows are excluded from growth and rate calculations."

  deploy:
    name: Build and deploy latest snapshot
    needs: collect
    if: needs.collect.outputs.snapshot_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main after snapshot commit
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical directory
        run: npm run directory:validate

      - name: Validate snapshot integrity
        run: npm run data:validate

      - name: Check collector syntax
        run: |
          node --check scripts/collect-daily-public.mjs
          node --check scripts/collect-or-retry-daily.mjs
          node --check scripts/retry-instagram-web.mjs
          node --check scripts/prepare-imputed-retry.mjs
          node --check scripts/impute-missing-daily.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site with latest snapshot
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
