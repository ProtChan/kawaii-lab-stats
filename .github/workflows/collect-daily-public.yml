name: Daily public social snapshot

on:
  schedule:
    - cron: "7 15 * * *"
    - cron: "27 15 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-public-social-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical official-account directory
        run: node scripts/validate-directory.mjs

      - name: Enforce midnight observation window
        run: node scripts/check-collection-window.mjs

      - name: Check daily collector syntax
        run: node --check scripts/collect-daily-public.mjs

      - name: Collect each canonical public profile once for the JST day
        run: node scripts/collect-daily-public.mjs

      - name: Validate snapshot integrity before commit
        run: node scripts/validate-snapshots.mjs

      - name: Commit the daily snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/live public/data && [ -z "$(git status --porcelain -- data/live public/data)" ]; then
            echo "No new daily snapshot to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live public/data
          git commit -m "data: daily social snapshot $(TZ=Asia/Tokyo date +%F)"
          git push

      - name: Summary
        if: always()
        run: |
          echo "Primary cadence: 00:07 JST; fallbacks: 00:27 / 00:47 JST."
          echo "Accepted observation window: 00:00-01:30 JST. Runs later than that fail before public-profile requests."
          echo "Collection uses only Node built-ins and does not depend on app npm packages."
          echo "The collector refuses a second run when data/live/history/YYYY-MM-DD.json is already complete."
          echo "Snapshot integrity is validated before a data commit is allowed."

  deploy:
    name: Build and deploy latest snapshot
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main after snapshot commit
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical directory
        run: npm run directory:validate

      - name: Validate snapshot integrity
        run: npm run data:validate

      - name: Check daily collector syntax
        run: node --check scripts/collect-daily-public.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site with latest snapshot
        run: npm run build

      - name: Exclude unrelated public artifacts from this site deployment
        run: rm -rf out/fx-dashboard

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
