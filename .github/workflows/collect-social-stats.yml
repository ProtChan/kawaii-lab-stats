name: Manual API collection (legacy DB path)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-api-social-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      SNAPSHOT_PROVIDER_URL: ${{ secrets.SNAPSHOT_PROVIDER_URL }}
      SNAPSHOT_PROVIDER_TOKEN: ${{ secrets.SNAPSHOT_PROVIDER_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate official account directory
        run: npm run directory:validate
      - name: Require database
        run: test -n "$DATABASE_URL"
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Collect configured API/provider sources manually
        run: npm run collect:all
