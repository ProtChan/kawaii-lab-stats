name: Prune off-cadence snapshots once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-off-cadence-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove snapshots outside midnight window
        shell: bash
        run: |
          rm -f data/live/history/2026-08-24.json public/data/history/2026-08-24.json
          rm -f data/live/history/2026-08-26.json public/data/history/2026-08-26.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const rejected = new Set(['2026-08-24', '2026-08-26']);
          const source = JSON.parse(await readFile('data/live/series.json', 'utf8'));
          const next = source.filter((point) => !rejected.has(point.date));
          const text = `${JSON.stringify(next, null, 2)}\n`;
          await writeFile('data/live/series.json', text);
          await writeFile('public/data/series.json', text);
          console.log(`Kept series dates: ${next.map((point) => point.date).join(', ')}`);
          NODE
      - name: Commit cleaned history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live public/data
          git commit -m "data: discard off-cadence snapshots"
          git push
