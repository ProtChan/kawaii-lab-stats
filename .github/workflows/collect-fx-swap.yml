name: Collect public FX swap points

on:
  schedule:
    # JST 07:00 and 12:00
    - cron: "0 22,3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fx_swap_watch/**"
      - "requirements-fx-swap.txt"
      - ".github/workflows/collect-fx-swap.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: fx-swap-collect-public
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector dependencies
        run: python -m pip install -r requirements-fx-swap.txt
      - name: Collect swap points
        run: python -m fx_swap_watch collect --data-dir public/fx-swap-watch/data --sleep-seconds 2
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fx-swap-watch/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update public FX swap data"
            git push
          fi
      - name: Deploy refreshed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
