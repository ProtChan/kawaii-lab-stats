name: Generate package lock once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-lockfile-once.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock.json
        shell: bash
        run: |
          test -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current."
            exit 0
          fi
          git commit -m "build: add reproducible npm lockfile"
          git push
