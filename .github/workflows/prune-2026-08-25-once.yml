name: Prune 2026-08-25 snapshot once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-2026-08-25-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove 2026-08-25 snapshot and rebuild derived series
        shell: bash
        run: |
          rm -f data/live/history/2026-08-25.json public/data/history/2026-08-25.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const source = JSON.parse(await readFile('data/live/series.json', 'utf8'));
          const next = source.filter((point) => point.date !== '2026-08-25');
          const text = `${JSON.stringify(next, null, 2)}\n`;
          await writeFile('data/live/series.json', text);
          await writeFile('public/data/series.json', text);
          console.log(`Kept series dates: ${next.map((point) => point.date).join(', ')}`);
          NODE
          node scripts/validate-snapshots.mjs
      - name: Commit cleaned history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live public/data
          git commit -m "data: reset clean cadence baseline to 2026-08-27"
          git push
