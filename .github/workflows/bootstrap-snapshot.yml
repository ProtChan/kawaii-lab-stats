name: Bootstrap daily snapshot via PR

on:
  pull_request:
    paths:
      - ".bootstrap-daily-snapshot"

permissions:
  contents: write

concurrency:
  group: daily-public-social-snapshot
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate canonical official-account directory
        run: npm run directory:validate

      - name: Collect today's snapshot once
        run: npm run collect:daily-public

      - name: Commit snapshot to PR branch
        shell: bash
        run: |
          if git diff --quiet -- data/live public/data && [ -z "$(git status --porcelain -- data/live public/data)" ]; then
            echo "No new daily snapshot to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live public/data
          git commit -m "data: bootstrap daily social snapshot $(TZ=Asia/Tokyo date +%F)"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
