name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate canonical directory
        run: npm run directory:validate
      - name: Check daily collector syntax
        run: node --check scripts/collect-daily-public.mjs
      - name: Build static site
        run: npm run build
