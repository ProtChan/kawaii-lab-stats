name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical directory
        run: npm run directory:validate
      - name: Validate snapshot integrity
        run: npm run data:validate
      - name: Check daily collector syntax
        run: node --check scripts/collect-daily-public.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build static site
        run: npm run build
