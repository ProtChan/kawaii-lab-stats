<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="国内FX業者のスワップポイントを比較する FX Swap Watch" />
    <title>FX Swap Watch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">PUBLIC BETA</p>
        <h1>FX Swap Watch</h1>
        <p>国内FX業者のスワップポイントを定期収集し、通貨ペア別・業者別に比較します。</p>
      </div>
      <div class="updated">
        <span>最終更新</span>
        <strong id="last-updated">読み込み中...</strong>
      </div>
    </header>

    <main>
      <section class="panel downloads">
        <h2>データ</h2>
        <a id="history-link" href="data/latest.csv">CSV</a>
        <a id="daily-link" href="data/latest.csv">latest CSV</a>
      </section>

      <section id="errors-panel" class="panel errors hidden">
        <h2>取得エラー</h2>
        <ul id="errors"></ul>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>最新スワップ一覧</h2>
          <input id="search" type="search" placeholder="業者名・通貨ペアで絞り込み" />
        </div>
        <div class="table-wrap">
          <table id="latest-table">
            <thead>
              <tr>
                <th>業者</th>
                <th>通貨ペア</th>
                <th>売買</th>
                <th>スワップ</th>
                <th>日数</th>
                <th>単位</th>
                <th>1万通貨/日</th>
                <th>取得元</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="grid">
        <div class="panel">
          <h2>通貨ペア別ランキング（買・1万通貨/日）</h2>
          <div id="pair-ranking" class="cards"></div>
        </div>
        <div class="panel">
          <h2>業者別一覧</h2>
          <div id="broker-list" class="cards"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>参考情報です。投資判断・取引条件は必ず各FX業者の公式サイトで確認してください。</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
